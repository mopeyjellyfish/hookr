on:
  push:
    branches:
      - main
  pull_request:

name: Lint
jobs:
  Audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - name: Fetch Repository
        uses: actions/checkout@v4
      - name: Run Tidy
        run: make tidy
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
      - name: golangci-lint
        run: make lint
